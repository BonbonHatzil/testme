# A composite action: a reusable bundle of steps that any job in this repo can call with
#   - uses: ./.github/actions/python-setup
# Both CI and CD need "install Python + dev tools", so it lives here once.
name: Python setup
description: Install Python and the dev tools (pylint, pytest), with pip caching.

inputs:
  python-version:
    description: Python version to install
    default: "3.13"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev requirements
      shell: bash
      run: python -m pip install -r requirements-dev.txt
