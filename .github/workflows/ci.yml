# CI: runs on every pull request into main. Its jobs are "required status checks" in the
# branch protection rule, so the Merge button stays locked until they're all green.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going for the old commit.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python-setup

      - name: Pylint
        run: pylint app tools tests

      - name: Pytest
        run: pytest -v

  docker-build:
    name: Docker build
    needs: lint-test # don't spend time building an image from code that fails lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: testme:pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # push: false + load: true = build it, keep it in the runner's local Docker, push it nowhere.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          out="$(docker run --rm "$IMAGE" CI)"
          echo "$out"
          grep -q "Hello, CI!" <<<"$out"
