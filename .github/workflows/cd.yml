# CD: runs after a PR is merged into main (a merge is a push to main).
# Same quality gate as CI, then a "release" build: SHA-tagged image, smoke test, report.
# There's no registry, so the deploy step only prints what a real deploy would push.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

# Never cancel a release halfway; queue the next one behind it instead.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python-setup
      - run: pylint app tools tests
      - run: pytest -q

  build-image:
    name: Build release image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      short-sha: ${{ steps.meta.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute tags
        id: meta
        run: echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            testme:${{ steps.meta.outputs.short-sha }}
            testme:latest
          build-args: APP_VERSION=${{ steps.meta.outputs.short-sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          IMAGE: testme:${{ steps.meta.outputs.short-sha }}
          SHORT_SHA: ${{ steps.meta.outputs.short-sha }}
        run: |
          out="$(docker run --rm "$IMAGE" main)"
          echo "$out"
          # The release build must report the commit it was built from.
          grep -q "testme $SHORT_SHA is alive" <<<"$out"

      # Anything appended to $GITHUB_STEP_SUMMARY renders as markdown on the run's summary page.
      - name: Write image report
        env:
          IMAGE: testme:${{ steps.meta.outputs.short-sha }}
        run: |
          {
            echo "## Release image"
            echo "| | |"
            echo "|---|---|"
            echo "| Tags | \`$IMAGE\`, \`testme:latest\` |"
            echo "| Size | $(docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec) |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (dry run)
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pretend to deploy
        env:
          SHORT_SHA: ${{ needs.build-image.outputs.short-sha }}
        run: |
          echo "A real pipeline would now run: docker push <registry>/testme:$SHORT_SHA"
          echo "Skipped on purpose: this repo has no registry."
          echo "Deployed testme:$SHORT_SHA (dry run) 🚀" >> "$GITHUB_STEP_SUMMARY"
